name: safe_sphere
description: "SafeSphere – AI Powered Emergency & Gender Safety App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
